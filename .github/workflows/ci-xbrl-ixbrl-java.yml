name: ci-xbrl-ixbrl-java

on:
  push:
    paths:
      - ".github/workflows/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "pmd-ruleset.xml"
      - "src/**"
      - "mapping/**"
      - "templates/**"
      - "scripts/**"
      - "xbrl.efrag.org/**"
      - "META-INF/**"
  pull_request:
    paths:
      - ".github/workflows/**"
      - "pom.xml"
      - "checkstyle.xml"
      - "pmd-ruleset.xml"
      - "src/**"
      - "mapping/**"
      - "templates/**"
      - "scripts/**"
      - "xbrl.efrag.org/**"
      - "META-INF/**"
  workflow_dispatch:

jobs:
  local-fast-path:
    name: Local quick run
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Run local fast-path verification
        run: mvn -B test

      - name: Run local quick pipeline execution
        shell: pwsh
        run: |
          $env:SKIP_ARELLE = "true"
          $env:FAIL_ON_VALIDATION_ISSUES = "false"
          mvn -B exec:java

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: esrs-local-fast-path-output
          path: |
            output/report-instance.xml
            output/report-ixbrl.xhtml
            output/report-interaktiv.html
            output/arelle-xbrl.log
            output/arelle-ixbrl.log

  strict-arelle-gate:
    name: Strict Arelle gate
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Setup Python and Arelle
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install arelle-release

      - name: Run strict production gate
        shell: pwsh
        env:
          ARELLE_CMD: ${{ vars.ARELLE_CMD || 'arelleCmdLine' }}
        run: |
          ./scripts/run-strict-production-gate.ps1 -ArelleCmd "$env:ARELLE_CMD"

      - name: Write build status summary
        shell: pwsh
        run: |
          $status = "PASS"
          $timestamp = (Get-Date).ToString("o")
          $branch = "${{ github.ref_name }}"
          $commit = "${{ github.sha }}"

          @"
          # Build status

          - workflow: ci-xbrl-ixbrl-java
          - branch: $branch
          - commit: $commit
          - timestamp: $timestamp
          - status: $status
          - source: GitHub Actions workflow
          - validation: strict production gate + Arelle validation + viewer plugin check
          - coverage: JaCoCo report generated during `mvn clean verify`
          "@ | Set-Content -Path "output/build-status.md" -Encoding utf8

      - name: Upload build status artifact
        uses: actions/upload-artifact@v4
        with:
          name: esrs-build-status
          path: |
            output/build-status.md
            target/site/jacoco/index.html
            target/site/jacoco/jacoco.xml
